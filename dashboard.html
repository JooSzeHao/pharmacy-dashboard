<style>
/* ════════════════════════════════════════════════════════════════════════════
   Bento Dashboard Design Kit — CSS
   Copied from JooSzeHao/vas-hsis-2026 design-system/design-kit.css — keep in sync with the kit.
   See DESIGN-SPEC.md for the rules behind these values.

   Fonts (add to <head>):
     <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Archivo:wdth,wght@75..125,700..900&display=swap" rel="stylesheet">

   Theme switch:  <html data-theme="dark">  → dark (Corelytics-inspired)
                  no attribute              → light (Crextio-inspired, default)

   Domain-named tokens (rename freely in a new project):
     --mb   / --mb-soft   / --on-mb   → series 1 (primary series)
     --pj   / --pj-soft   / --on-pj   → series 2 (accent series)
     --comb / --comb-soft             → series 3 (aggregate / combined)
     --svc-*  + --svc-on              → categorical palette (5 categories) + glyph colour on it
   ════════════════════════════════════════════════════════════════════════════ */

/* ── Design tokens — light (Crextio-inspired) ── */
:root {
  --font:        'Outfit', system-ui, sans-serif;
  --bg:          #ECEBE6;
  --bg-img:      radial-gradient(circle at 100% 100%, rgba(242,194,48,.20), transparent 42%), linear-gradient(160deg, #EDEDEB 0%, #F1EEE4 100%);
  --card:        rgba(255,255,255,.86);
  --card-solid:  #FFFFFF;
  --line:        rgba(28,28,30,.08);
  --text:        #1C1C1E;
  --muted:       #7A7A80;
  --pill-on-bg:  #1C1C1E;
  --pill-on-fg:  #FFFFFF;
  --acc:         #F2C230;
  --acc-fg:      #1C1C1E;
  --side:        #1C1C1E;
  --side-fg:     #9A9AA0;
  --side-hover:  rgba(255,255,255,.08);
  --dk:          #1C1C1E;
  --dk-fg:       #F4F4F2;
  --dk-muted:    #8E8E94;
  --dk-line:     rgba(255,255,255,.08);
  --mb:          #1C1C1E;
  --mb-soft:     #B9B9BE;
  --on-mb:       #FFFFFF;
  --pj:          #F2C230;
  --pj-soft:     #F7DE8C;
  --on-pj:       #1C1C1E;
  --comb:        #9A9AA0;
  --comb-soft:   #D4D4D8;
  --hatch:       rgba(28,28,30,.28);
  --grid:        rgba(28,28,30,.07);
  --target:      rgba(28,28,30,.45);
  --tip-bg:      #1C1C1E;
  --tip-fg:      #FFFFFF;
  --ok:          #4F7F52;  --ok-dim:   #E3ECDD;
  --warn:        #B8860B;  --warn-dim: #F8EDC9;
  --bad:         #B5533C;  --bad-dim:  #F3DFD6;
  --stripe:      rgba(28,28,30,.025);
  --hover:       rgba(242,194,48,.14);
  --shadow:      0 1px 2px rgba(28,28,30,.04), 0 10px 28px rgba(28,28,30,.06);
  /* Service colours — same hues as the service logos, tuned to the warm light theme */
  --svc-ump:     #C9503F;   /* red → terracotta */
  --svc-locker:  #5A6372;   /* slate */
  --svc-esyms:   #2E8C80;   /* teal */
  --svc-idtf:    #7462C4;   /* violet */
  --svc-pandu:   #C98A2A;   /* amber → ochre */
  --svc-on:      #FFFFFF;   /* glyph / label colour on a service fill */
  --r-card:      22px;
  --r-in:        14px;
  --side-w:      64px;
}
/* ── Dark (Corelytics-inspired) ── */
:root[data-theme="dark"] {
  --bg:          #100D29;
  --bg-img:      radial-gradient(circle at 85% 0%, rgba(124,131,253,.16), transparent 45%), radial-gradient(circle at 0% 100%, rgba(232,121,198,.08), transparent 40%), linear-gradient(180deg, #110E2B 0%, #0E0B24 100%);
  --card:        #1B1840;
  --card-solid:  #1B1840;
  --line:        rgba(255,255,255,.08);
  --text:        #ECEBFA;
  --muted:       #8C89B4;
  --pill-on-bg:  #7C83FD;
  --pill-on-fg:  #FFFFFF;
  --acc:         #7C83FD;
  --acc-fg:      #FFFFFF;
  --side:        #17143A;
  --side-fg:     #8C89B4;
  --side-hover:  rgba(255,255,255,.06);
  --dk:          #231F52;
  --dk-fg:       #ECEBFA;
  --dk-muted:    #8C89B4;
  --dk-line:     rgba(255,255,255,.07);
  --mb:          #7C83FD;
  --mb-soft:     #3E4290;
  --on-mb:       #FFFFFF;
  --pj:          #F5C66A;
  --pj-soft:     #8A7140;
  --on-pj:       #1C1C1E;
  --comb:        #E879C6;
  --comb-soft:   #7A3F6C;
  --hatch:       rgba(255,255,255,.20);
  --grid:        rgba(255,255,255,.07);
  --target:      rgba(236,235,250,.45);
  --tip-bg:      #2A2660;
  --tip-fg:      #ECEBFA;
  --ok:          #7DD3B0;  --ok-dim:   rgba(125,211,176,.14);
  --warn:        #F5C66A;  --warn-dim: rgba(245,198,106,.14);
  --bad:         #F28BA8;  --bad-dim:  rgba(242,139,168,.14);
  --stripe:      rgba(255,255,255,.025);
  --hover:       rgba(124,131,253,.14);
  --shadow:      0 10px 30px rgba(0,0,0,.28);
  /* Service colours — brighter pastels that sit on the navy theme */
  --svc-ump:     #F07A6A;
  --svc-locker:  #A7B1C4;
  --svc-esyms:   #5FD3C3;
  --svc-idtf:    #A994F7;
  --svc-pandu:   #F2B35E;
  --svc-on:      #17143A;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font); background: var(--bg); background-image: var(--bg-img);
  background-attachment: fixed; color: var(--text);
  font-size: 15px; line-height: 1.5; min-height: 100vh;
  font-variant-numeric: tabular-nums;
}
button { font-family: var(--font); }

/* ── Side toolbar ── */
.side {
  position: fixed; left: 12px; top: 12px; bottom: 12px; width: var(--side-w); z-index: 120;
  background: var(--side); border-radius: 20px; padding: 10px;
  display: flex; flex-direction: column; gap: 6px; transition: width .2s ease;
  overflow-x: hidden; overflow-y: auto; scrollbar-width: none;
}
.side::-webkit-scrollbar { display: none; }
body.side-open { --side-w: 232px; }
body.side-peek .side { width: 232px; box-shadow: 0 24px 60px rgba(0,0,0,.32); }
body.side-peek .side-label { opacity: 1; }
body.side-peek #side-expand svg { transform: none; }
.side-sec, .side-extra { display: none; }
body.side-open .side-sec, body.side-peek .side-sec { display: block; }
body.side-open .side-extra, body.side-peek .side-extra { display: flex; }
.side-sec { font-size: 11px; color: var(--side-fg); margin: 10px 8px 2px; white-space: nowrap; letter-spacing: .3px; flex-shrink: 0; }
.side-extra { flex-direction: column; gap: 6px; flex-shrink: 0; }
.side-box {
  border: 1px solid var(--dk-line); border-radius: 13px; padding: 9px 11px; margin: 0 2px;
  font-size: 12px; color: var(--dk-fg); white-space: nowrap;
}
.side-box .r { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.side-box .r > span:first-child { color: var(--side-fg); }
.side-box .r > span:last-child { overflow: hidden; text-overflow: ellipsis; text-align: right; }
.side-box a { color: var(--dk-fg); text-decoration: none; border-bottom: 1px dashed var(--side-fg); }
.side-box a:hover { color: var(--acc); border-color: var(--acc); }
.side-reset {
  margin-top: 7px; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
  padding: 3px 10px; border-radius: 999px; border: 1px solid var(--dk-line);
  background: transparent; color: var(--side-fg); cursor: pointer;
}
.side-reset:hover { color: var(--dk-fg); border-color: var(--side-fg); }
.side-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 44px; color: var(--dk-fg); white-space: nowrap; }
.side-logo .mark {
  width: 44px; height: 44px; flex-shrink: 0; border-radius: 13px; background: var(--acc); color: var(--acc-fg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px;
}
.side-logo .side-label { font-size: 14px; font-weight: 600; line-height: 1.2; }
.side-logo .side-label small { display: block; font-size: 11px; font-weight: 400; color: var(--side-fg); }
.side-btn {
  display: flex; align-items: center; gap: 12px; height: 44px; width: 100%; flex-shrink: 0;
  border: none; background: transparent; color: var(--side-fg); border-radius: 13px;
  padding: 0 12px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap;
  transition: background .15s, color .15s; user-select: none;
}
.side-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.side-btn:hover { background: var(--side-hover); color: var(--dk-fg); }
.side-btn.active { background: var(--acc); color: var(--acc-fg); }
.side-btn:disabled { opacity: .45; cursor: not-allowed; }
.side-label { opacity: 0; transition: opacity .15s; }
body.side-open .side-label { opacity: 1; }
.side-spacer { flex: 1; }
.side-sep { height: 1px; background: var(--dk-line); margin: 6px 4px; flex-shrink: 0; }
#side-expand svg { transition: transform .2s; }
body.side-open #side-expand svg { transform: rotate(180deg); }
#label-toggle.on { color: var(--acc); }
#label-toggle.on:hover { color: var(--acc); }

/* ── Main column ── */
.main { margin-left: calc(var(--side-w) + 24px); padding: 14px 24px 104px 0; transition: margin-left .2s ease; max-width: calc(1460px + var(--side-w)); }

/* ── Floating service dock (bottom centre) ── */
.dock {
  position: fixed; bottom: 18px; left: calc(50% + (var(--side-w) + 12px) / 2); transform: translateX(-50%);
  z-index: 110; display: flex; align-items: center; gap: 4px;
  background: var(--dk); color: var(--dk-fg); border-radius: 22px; padding: 8px 10px;
  box-shadow: 0 18px 44px rgba(0,0,0,.28), 0 2px 6px rgba(0,0,0,.12);
  transition: left .2s ease;
}
.dock-label { display: flex; flex-direction: column; line-height: 1.1; padding: 0 8px 0 6px; white-space: nowrap; }
.dock-label b { font-size: 13px; font-weight: 500; }
.dock-label span { font-size: 11px; color: var(--dk-muted); }
.dock-sep { width: 1px; height: 30px; background: var(--dk-line); margin: 0 6px; }
.dock-item {
  position: relative; width: 46px; height: 46px; border: none; background: none; cursor: pointer;
  border-radius: 14px; display: flex; align-items: center; justify-content: center;
  transition: transform .15s ease, background .15s;
}
.dock-item svg { transition: opacity .15s, filter .15s; }
.dock-item:hover { transform: translateY(-5px); background: var(--dk-line); }
.dock-item:not(.on) svg { opacity: .3; filter: grayscale(1); }
.dock-item::before {
  content: ''; position: absolute; bottom: 2px; left: 50%; width: 4px; height: 4px; margin-left: -2px;
  border-radius: 50%; background: var(--acc); opacity: 0; transition: opacity .15s;
}
.dock-item.on::before { opacity: 1; }
.dock-item::after {
  content: attr(data-tip); position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%);
  background: var(--tip-bg); color: var(--tip-fg); font-size: 12px; white-space: pre; text-align: center;
  padding: 6px 10px; border-radius: 10px; pointer-events: none; opacity: 0; transition: opacity .12s;
  box-shadow: 0 8px 20px rgba(0,0,0,.2); line-height: 1.35;
}
.dock-item:hover::after { opacity: 1; }
.dock-all {
  font-size: 12px; padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--dk-line); background: transparent; color: var(--dk-muted);
}
.dock-all:hover { color: var(--dk-fg); border-color: var(--dk-muted); }
.dock { transition: left .2s ease, opacity .2s ease, transform .2s ease; }
body:not([data-tab="2"]) .dock { opacity: 0; pointer-events: none; transform: translate(-50%, 24px); }
body:not([data-tab="2"]) .main { padding-bottom: 28px; }

/* ── Header ── */
.header { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 14px; gap: 12px; }
.htitle { font-size: 20px; font-weight: 600; letter-spacing: -.2px; }
.hsub { font-size: 12px; color: var(--muted); }
#last-updated { font-size: 12px; color: var(--muted); white-space: nowrap; }
.hstamp { display: none; font-size: 11.5px; color: var(--muted); }

/* ── Filter bar ── */
.filter-bar {
  background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  position: sticky; top: 10px; z-index: 99; margin-bottom: 22px;
}
.fg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fl { font-size: 11.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.fsep { width: 1px; height: 22px; background: var(--line); }
.toggle-btn, .preset-btn, .view-btn, .btn-dl {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 13px;
  border-radius: 999px; border: 1px solid var(--line); font-size: 12.5px;
  font-weight: 500; cursor: pointer; background: var(--card-solid);
  color: var(--muted); transition: all .15s; white-space: nowrap;
}
.toggle-btn:hover, .preset-btn:hover, .view-btn:hover, .btn-dl:hover { color: var(--text); border-color: var(--target); }
.toggle-btn.active, .preset-btn.active, .view-btn.active { background: var(--pill-on-bg); color: var(--pill-on-fg); border-color: var(--pill-on-bg); }
.view-btn, .btn-dl { font-size: 11.5px; padding: 4px 11px; }
.btn-dl:active { opacity: .8; }
select {
  padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line);
  font-size: 12.5px; color: var(--text); background: var(--card-solid);
  font-family: var(--font); font-weight: 500; cursor: pointer;
}
select:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 2px var(--hover); }
select option { background: var(--card-solid); color: var(--text); }

/* ── Panels ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── Hero ── */
.hero { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin: 4px 4px 20px; }
.hero h1 { font-size: 40px; font-weight: 400; line-height: 1.1; letter-spacing: -.8px; }
.hero h1 span { color: var(--muted); }
.hero-stats { display: flex; gap: 34px; flex-wrap: wrap; }
.hero-stat .v { font-family: 'Archivo', var(--font); font-size: 58px; font-weight: 800; font-stretch: 112%; line-height: 1; letter-spacing: -1.5px; }
.hero-stat .v small { font-size: 24px; font-weight: 800; margin-left: 2px; }
.hero-stat .l { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.hero-stat .gap { font-size: 11.5px; color: var(--text); margin-top: 3px; max-width: 190px; line-height: 1.35; }
.hero-stat .gap b { font-weight: 600; }

/* ── Scope tags: what each card follows ── */
.card-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.scope-tag {
  font-size: 10.5px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--line); color: var(--muted); background: var(--card-solid); cursor: help;
}
.scope-tag.ytd  { color: var(--text); border-color: var(--pj); }
.scope-tag.all  { border-style: dashed; }

/* ── Skeleton (first load) ── */
.skel { background: var(--line); border-radius: 12px; position: relative; overflow: hidden; }
.skel::after {
  content: ''; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation: shimmer 1.3s infinite;
}
:root[data-theme="dark"] .skel::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent); }
@keyframes shimmer { to { transform: translateX(100%); } }
#refresh-btn.busy svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Keyboard focus ── */
:where(button, select, a, [tabindex]):focus { outline: none; }
:where(button, select, a, [tabindex]):focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.side-btn:focus-visible, .dock-item:focus-visible { outline-offset: -2px; }
.st-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 999px; margin-top: 8px; }
.st-ok   .v { color: var(--ok); }   .st-ok   .st-chip { background: var(--ok-dim);   color: var(--ok); }
.st-warn .v { color: var(--warn); } .st-warn .st-chip { background: var(--warn-dim); color: var(--warn); }
.st-bad  .v { color: var(--bad); }  .st-bad  .st-chip { background: var(--bad-dim);  color: var(--bad); }
.st-none .st-chip { background: var(--line); color: var(--muted); }

/* ── Progress pills ── */
.prog-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin: 0 4px 22px; }
.prog-lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.prog-bar {
  position: relative; height: 34px; border-radius: 999px; border: 1px solid var(--line);
  background: repeating-linear-gradient(135deg, var(--line) 0 5px, transparent 5px 10px);
}
.prog-bar > div {
  height: 100%; border-radius: 999px; font-size: 12.5px; font-weight: 500;
  padding-left: 14px; display: flex; align-items: center; min-width: 54px;
}
.prog-bar > div.outline { border: 1.5px solid var(--text); color: var(--text); background: transparent; }
.prog-bar > i { position: absolute; top: -4px; bottom: -4px; width: 2px; border-radius: 1px; background: var(--target); }

/* ── Bento ── */
.bento-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; margin-bottom: 16px; }
.gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.gauge-wrap svg { width: 100%; max-width: 210px; height: auto; }
.neutral-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }

/* ── Cards ── */
.row { display: grid; gap: 16px; margin-bottom: 16px; }
.row-1 { grid-template-columns: minmax(0,1fr); }
.row-2 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.card {
  background: var(--card);
  border-radius: var(--r-card); padding: 20px 22px; border: 1px solid var(--line);
  box-shadow: var(--shadow); min-width: 0;
}
.card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-title-wrap { display: flex; flex-direction: column; gap: 2px; }
.card-title { font-size: 16px; font-weight: 500; color: var(--text); }
.card-meta  { font-size: 12px; color: var(--muted); }
.chart-wrap { position: relative; height: 260px; }
.view-toggles { display: flex; gap: 4px; flex-wrap: wrap; }


/* ── Tab-local filter bar (Location Comparison) ── */
.tab-filter {
  background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  border-radius: 999px; padding: 8px 16px;
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px;
}

/* ── Tables ── */
.table-wrap { overflow: auto; max-height: 560px; border-radius: var(--r-in); border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  padding: 11px 14px; text-align: left; font-size: 11.5px; font-weight: 500; color: var(--muted);
  border-bottom: 1px solid var(--line); white-space: nowrap; position: relative; background: var(--card-solid);
}
thead th.num, thead th.r { text-align: right; }
.table-wrap thead th { position: sticky; top: 0; z-index: 2; }
.table-wrap thead th:first-child { left: 0; z-index: 3; }
tbody td:first-child { position: sticky; left: 0; z-index: 1; font-weight: 500; white-space: nowrap; }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--line); color: var(--text); background: var(--card-solid); }
tbody tr:nth-child(even) td { background-image: linear-gradient(var(--stripe), var(--stripe)); }
tbody tr:hover td { background-image: linear-gradient(var(--hover), var(--hover)); }
tbody tr:last-child td { border-bottom: none; font-weight: 600; }
.num { font-size: 12.5px; text-align: right; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-weight: 500; font-size: 11.5px; white-space: nowrap; }
.badge-green { background: var(--ok-dim);  color: var(--ok); }
.badge-red   { background: var(--bad-dim); color: var(--bad); }
.badge-amber { background: var(--warn-dim); color: var(--warn); }

/* ── Service ranking (dark bento card) ── */
.rank-card { background: var(--dk); color: var(--dk-fg); border-color: var(--dk); }
.rank-card .card-title { color: var(--dk-fg); }
.rank-card .card-meta  { color: var(--dk-muted); }
.rank-big { font-size: 30px; font-weight: 300; line-height: 1; white-space: nowrap; }
.rank-list { display: flex; flex-direction: column; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-top: 1px solid var(--dk-line); font-size: 13.5px; }
.rank-row .rk { width: 14px; font-size: 11px; color: var(--dk-muted); text-align: right; }
.rank-row .nm { flex: 1; min-width: 0; }
.rank-row .nm small { display: block; font-size: 11px; color: var(--dk-muted); }
.rank-row .mv { font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.rank-row .mv.up { color: var(--ok); } .rank-row .mv.dn { color: var(--bad); } .rank-row .mv.na { color: var(--dk-muted); }
.empty-card { text-align: center; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty-card .empty-ico { width: 52px; height: 52px; border-radius: 50%; background: var(--line); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.empty-card .toggle-btn { margin-top: 8px; }
.svc-cell { display: flex; align-items: center; gap: 8px; }
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text); }
thead th.sort-asc::after  { content: ' ▲'; font-size: 8px; opacity: .8; }
thead th.sort-desc::after { content: ' ▼'; font-size: 8px; opacity: .8; }

/* ── KPI pills (service scorecards) ── */
.kpi-pill { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 999px; }
.pill-green { background: var(--ok-dim);  color: var(--ok); }
.pill-red   { background: var(--bad-dim); color: var(--bad); }
.pill-gray  { background: var(--line);    color: var(--muted); }

/* ── Service scorecard grid ── */
.svc-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.svc-card {
  background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow);
  border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
}
.svc-card-head { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; }
.svc-total { font-size: 30px; font-weight: 300; line-height: 1.05; letter-spacing: -.5px; }
.svc-deltas { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.svc-split-row { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.svc-split-bar { flex: 1; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); display: flex; }
.svc-split-bar > span { display: block; height: 100%; }
.svc-split-mb { background: var(--mb); }
.svc-split-pj { background: var(--pj); }
.svc-spark { margin-top: 4px; width: 100%; height: 28px; color: var(--svc-color, var(--mb)); }
.svc-spark polyline { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.svc-spark circle { fill: currentColor; }
.svc-spark .spark-area { fill: currentColor; opacity: .12; stroke: none; }
.section-title { font-size: 13px; font-weight: 500; color: var(--muted); margin: 4px 4px 10px; }

/* ── Target line legend ── */
.target-note { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--muted); margin-bottom: 8px; }
.target-note::before { content: ''; display: block; width: 26px; border-top: 2px dashed var(--target); }

/* ── Error banner ── */
#error-banner { background: var(--bad-dim); color: var(--bad); padding: 12px 20px; font-size: 13px; font-weight: 500; display: none; border-radius: var(--r-in); margin-bottom: 14px; }
#error-banner.visible { display: block; }

/* ── Performance heatmap ── */
.heatmap-wrap { overflow-x: auto; }
.heatmap-table { border-collapse: separate; border-spacing: 4px; width: 100%; }
.heatmap-table thead th { font-size: 11px; font-weight: 500; color: var(--muted); padding: 4px 6px; border: none; text-align: center; background: transparent; }
.heatmap-table thead th:first-child { text-align: left; }
.heatmap-table tbody th { font-size: 12px; font-weight: 500; color: var(--text); padding: 5px 8px; text-align: left; white-space: nowrap; }
.heatmap-cell { text-align: center; padding: 7px 3px; font-size: 11.5px; font-weight: 500; border-radius: 8px; }
.hm-hit   { background: var(--ok-dim);   color: var(--ok); }
.hm-close { background: var(--warn-dim); color: var(--warn); }
.hm-miss  { background: var(--bad-dim);  color: var(--bad); }
.hm-empty { background: transparent;     color: var(--muted); opacity: .5; }

/* ── Responsive ── */
@media (max-width: 1100px) {
  .bento-3 { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .bento-3 > .rank-card { grid-column: 1 / -1; }
  .prog-row { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .hero-stat .v { font-size: 46px; }
}
@media (max-width: 900px) {
  .row-2 { grid-template-columns: minmax(0,1fr); }
  .filter-bar, .tab-filter { border-radius: 22px; }
}
@media (max-width: 640px) {
  body, body.side-open { --side-w: 0px; }
  .side {
    top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 60px;
    flex-direction: row; align-items: center; justify-content: space-around; padding: 8px;
  }
  .side-logo, .side-spacer, .side-sep, #side-expand, .side-sec, .side-extra { display: none !important; }
  .side-btn { width: 44px; padding: 0; justify-content: center; }
  .side-label { display: none; }
  .main { margin: 0; padding: 10px 16px 140px; }
  .dock { left: 50%; bottom: 76px; padding: 6px 8px; max-width: calc(100% - 16px); }
  .dock-label, .dock-sep { display: none; }
  .dock-item { width: 40px; height: 40px; }
  .dock-item::after { display: none; }
  .hsub, #last-updated { display: none; }
  .hstamp { display: block; }
  .filter-bar { position: relative; top: auto; border-radius: 18px; gap: 8px; }
  .fsep { display: none; }
  .hero h1 { font-size: 28px; }
  .hero-stats { gap: 18px; }
  .hero-stat .v { font-size: 36px; }
  .hero-stat .v small { font-size: 16px; }
  .prog-row, .bento-3 { grid-template-columns: minmax(0,1fr); }
  .bento-3 > .rank-card { grid-column: auto; }
  .card { padding: 16px; border-radius: 18px; }
  .chart-wrap { height: 220px !important; }
  select { padding: 4px 8px; font-size: 12px; }
  .toggle-btn, .preset-btn { padding: 4px 10px; font-size: 12px; }
}

/* ── Print / Save as PDF ── */
@media print {
  @page { margin: 12mm; }
  .side, .dock, .filter-bar, .btn-dl, .view-toggles, .tab-filter, #error-banner { display: none !important; }
  body { background: #fff !important; background-image: none !important; }
  .main { margin: 0 !important; padding: 0 !important; max-width: none; }
  .card, .svc-card { box-shadow: none !important; background: #fff !important; break-inside: avoid; border-color: #ddd; }
  .table-wrap { max-height: none !important; overflow: visible !important; }
  .scope-tag { display: none; }
  .row, .bento-3, .prog-row, .hero { break-inside: avoid; }
  #last-updated, .hsub { display: block !important; }
}

/* ════════════════════════════════════════════════════════════════════════════
   Glass layer — light frost on cards, clear chart cards, dark side panel
   ════════════════════════════════════════════════════════════════════════════ */
:root {
  --glass:        rgba(255,255,255,.74);
  --glass-strong: rgba(255,255,255,.88);
  --glass-edge:   rgba(255,255,255,.75);
  --glass-hi:     inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.25);
  --glass-blur:   blur(14px) saturate(130%);
  --shadow:       0 1px 2px rgba(28,28,30,.04), 0 18px 40px rgba(28,28,30,.08);
  --card-solid:   #FFFFFF;
  --blob-1: rgba(242,194,48,.45);  --blob-2: rgba(46,140,128,.22);
  --blob-3: rgba(116,98,196,.22);  --blob-4: rgba(201,80,63,.16);
}
:root[data-theme="dark"] {
  --glass:        rgba(30,27,72,.78);
  --glass-strong: rgba(30,27,72,.92);
  --glass-edge:   rgba(255,255,255,.12);
  --glass-hi:     inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(255,255,255,.03);
  --shadow:       0 18px 44px rgba(0,0,0,.35);
  --blob-1: rgba(124,131,253,.30); --blob-2: rgba(232,121,198,.18);
  --blob-3: rgba(95,211,195,.12);  --blob-4: rgba(245,198,106,.10);
}

/* Colour fields behind the glass — without them there's nothing to frost */
body::before {
  content: ''; position: fixed; inset: -10vmax; z-index: -1; pointer-events: none;
  background:
    radial-gradient(28vmax 28vmax at 18% 12%, var(--blob-1), transparent 70%),
    radial-gradient(30vmax 30vmax at 88% 22%, var(--blob-3), transparent 70%),
    radial-gradient(34vmax 34vmax at 70% 85%, var(--blob-2), transparent 70%),
    radial-gradient(26vmax 26vmax at 10% 78%, var(--blob-4), transparent 70%);
  filter: blur(10px);
}

.card, .svc-card, .filter-bar, .tab-filter {
  background: var(--glass);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  border: 1px solid var(--glass-edge);
  box-shadow: var(--shadow), var(--glass-hi);
}
/* Dark feature card stays the anchor: smoked glass instead of solid */
.rank-card {
  background: rgba(28,28,30,.94); border-color: rgba(255,255,255,.10);
  -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.10);
}
:root[data-theme="dark"] .rank-card { background: rgba(44,39,104,.95); border-color: rgba(255,255,255,.12); }
.side { background: rgba(14,14,16,.97); border: 1px solid rgba(255,255,255,.06); box-shadow: 0 18px 44px rgba(0,0,0,.28); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
:root[data-theme="dark"] .side { background: rgba(9,7,26,.96); border: 1px solid rgba(255,255,255,.07); box-shadow: 0 18px 44px rgba(0,0,0,.45); }

/* Tables: let the glass through, keep the sticky header readable */
.table-wrap { border-color: var(--glass-edge); background: rgba(255,255,255,.55); }
:root[data-theme="dark"] .table-wrap { background: rgba(27,24,64,.6); }
tbody td { background: transparent; }
tbody td:first-child, thead th { background: var(--glass-strong); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.prog-bar { background-color: rgba(255,255,255,.25); }
:root[data-theme="dark"] .prog-bar { background-color: rgba(255,255,255,.03); }
.toggle-btn, .preset-btn, .view-btn, .btn-dl, select, input[type="date"] { background-color: var(--glass-strong); border-color: var(--glass-edge); }
.toggle-btn.active, .preset-btn.active { background: var(--pill-on-bg); }

/* Chart cards and service scorecards: clear glass, so charts sit on the colour field. Tables and number cards stay frosted. */
.card:has(.chart-wrap), .card:has(.gauge-wrap), .svc-card {
  background: rgba(255,255,255,.10);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  border-color: rgba(255,255,255,.55);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}
:root[data-theme="dark"] .card:has(.chart-wrap), :root[data-theme="dark"] .card:has(.gauge-wrap), :root[data-theme="dark"] .svc-card {
  background: rgba(30,27,72,.18); border-color: rgba(255,255,255,.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
}

/* Printing: no blur, plain white */
@media print { body::before { display: none; } .card, .svc-card { backdrop-filter: none !important; } }
</style>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   Bento Dashboard Design Kit — Chart.js theme helpers
   Copied from JooSzeHao/vas-hsis-2026 design-system/chart-theme.js; adapted: TARGET, CATEGORY_VARS, isTarget. Needs Chart.js 4.4 and (optionally)
   chartjs-plugin-datalabels 2.2 loaded first, plus design-kit.css on the page.

     <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"><\/script>
     <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"><\/script>
     <script src="chart-theme.js"><\/script>

   Usage:
     applyChartTheme();                       // after load and after every theme switch
     new Chart(el, { type:'line', data, options: baseOpts({ scales:{...} }, { datalabels: DL.linePct }) });
   Charts read colours from THEME.* — rebuild charts after a theme switch.
   ════════════════════════════════════════════════════════════════════════════ */

/* ── Config ── */
const TARGET       = 95;                       // KPI target: % of patients seen within 30 min
const NEAR         = TARGET - 5;               // "near target" lower bound
const TARGET_LABEL = `${TARGET}% Target`;      // dataset label used for target lines
let   showLabels   = window.innerWidth > 640;  // global data-label switch (off on phones)

/* Categorical palette: name → CSS variable (values live in design-kit.css) */
const CATEGORY_VARS   = { KURANG3:'--svc-k3', LEBIH3:'--svc-l3', BMSONLY:'--svc-ul' };
const CATEGORY_COLORS = {};                    // filled by applyChartTheme()

/* ── Theme engine: reads the CSS tokens of the active light/dark theme ── */
const THEME = {};
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

const GRID    = { color:'rgba(28,28,30,0.07)', drawBorder:false };
const TICKS   = { color:'#7A7A80', font:{ size:12, family:"'Outfit', sans-serif" } };
const TOOLTIP = { backgroundColor:'#1C1C1E', cornerRadius:12, padding:12, titleFont:{ size:12, weight:'500' },
                  bodyFont:{ size:12 }, boxPadding:4, usePointStyle:true };

function applyChartTheme() {
  ['text','muted','mb','mb-soft','on-mb','pj','pj-soft','on-pj','comb','comb-soft','hatch','grid','target',
   'tip-bg','tip-fg','card-solid','acc','acc-fg','svc-on'].forEach(k => {
    THEME[k.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = cssVar('--' + k);
  });
  THEME.dark = document.documentElement.dataset.theme === 'dark';
  Object.keys(CATEGORY_VARS).forEach(k => { CATEGORY_COLORS[k] = cssVar(CATEGORY_VARS[k]); });
  GRID.color = THEME.grid;
  TICKS.color = THEME.muted;
  TOOLTIP.backgroundColor = THEME.tipBg;
  TOOLTIP.titleColor = THEME.tipFg;
  TOOLTIP.bodyColor = THEME.tipFg;
  Chart.defaults.color = THEME.muted;
  Chart.defaults.borderColor = THEME.grid;
  Chart.defaults.font.family = "'Outfit', sans-serif";
  Chart.defaults.font.size = 12;
  DL.line.color = THEME.text;
  DL.barGroup.color = THEME.text;
}

/* Theme switch with persistence (wire to a button) */
function toggleTheme(rerender) {
  const dark = document.documentElement.dataset.theme !== 'dark';
  if (dark) document.documentElement.dataset.theme = 'dark';
  else delete document.documentElement.dataset.theme;
  try { localStorage.setItem('dash-theme', dark ? 'dark' : 'light'); } catch (e) {}
  applyChartTheme();
  if (rerender) rerender();
}
/* Put this inline in <head> to avoid a flash of the wrong theme:
   <script>try{if(localStorage.getItem('dash-theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}<\/script> */

/* ── Helpers ── */
function rgba(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

/* Diagonal hatch fill — "remainder" / non-target part of a stack */
function hatchPattern() {
  const c = document.createElement('canvas');
  c.width = c.height = 8;
  const x = c.getContext('2d');
  x.fillStyle = THEME.cardSolid; x.fillRect(0, 0, 8, 8);
  x.strokeStyle = THEME.hatch; x.lineWidth = 1.6;
  x.beginPath();
  x.moveTo(-2, 10); x.lineTo(10, -2);
  x.moveTo(-2, 2);  x.lineTo(2, -2);
  x.moveTo(6, 10);  x.lineTo(10, 6);
  x.stroke();
  return x.createPattern(c, 'repeat');
}

/* Vertical fade under a line series */
function areaGradient(canvas, hex, height = 300) {
  const g = canvas.getContext('2d').createLinearGradient(0, 0, 0, height);
  g.addColorStop(0, rgba(hex, THEME.dark ? 0.28 : 0.14));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  return g;
}

/* KPI status — used ONLY for the hero indicators and table badges */
function kpiStatus(pct) {
  if (pct === null || !isFinite(pct)) return { cls: 'st-none', label: 'No data' };
  if (pct >= TARGET) return { cls: 'st-ok',   label: 'On target' };
  if (pct >= NEAR)   return { cls: 'st-warn', label: 'Near target' };
  return { cls: 'st-bad', label: 'Below target' };
}

/* Stacked bars, connected: round only the top visible segment of each bar */
function topSegmentRadius(r = 8) {
  return ctx => {
    const ds = ctx.chart.data.datasets, i = ctx.dataIndex;
    for (let k = ds.length - 1; k >= 0; k--) {
      if (!ctx.chart.isDatasetVisible(k) || !(ds[k].data[i] > 0)) continue;
      return k === ctx.datasetIndex ? { topLeft: r, topRight: r } : 0;
    }
    return 0;
  };
}

/* ── Plugins ── */
/* Soft glow under line series in dark mode (skips the target line) */
Chart.register({
  id: 'lineGlow',
  beforeDatasetDraw(chart, args) {
    const ds = chart.data.datasets[args.index];
    if (!THEME.dark || (ds.type || chart.config.type) !== 'line' || ds.isTarget) return;
    chart.ctx.save();
    chart.ctx.shadowColor = typeof ds.borderColor === 'string' ? ds.borderColor : THEME.mb;
    chart.ctx.shadowBlur = 14;
  },
  afterDatasetDraw(chart, args) {
    const ds = chart.data.datasets[args.index];
    if (!THEME.dark || (ds.type || chart.config.type) !== 'line' || ds.isTarget) return;
    chart.ctx.restore();
  }
});

/* Big number in the middle of a doughnut: options.plugins.centerLabel = { display, value, label } */
Chart.register({
  id: 'centerLabel',
  afterDraw(chart) {
    const opt = chart.options.plugins && chart.options.plugins.centerLabel;
    if (!opt || !opt.display) return;
    const { ctx, chartArea:{ left, right, top, bottom } } = chart;
    const cx = (left + right) / 2, cy = (top + bottom) / 2;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = THEME.text;  ctx.font = "300 26px 'Outfit', sans-serif";
    ctx.fillText(opt.value || '', cx, cy - 7);
    ctx.fillStyle = THEME.muted; ctx.font = "500 11px 'Outfit', sans-serif";
    ctx.fillText(opt.label || 'Total', cx, cy + 11);
    ctx.restore();
  }
});

/* Totals above stacked bars — pass in a chart's own `plugins: [stackTotals]` */
const stackTotals = {
  id: 'stackTotals',
  afterDatasetsDraw(chart) {
    if (!showLabels) return;
    const { ctx } = chart;
    const metas = chart.data.datasets.map((_, i) => chart.getDatasetMeta(i)).filter(m => !m.hidden);
    if (!metas.length) return;
    ctx.save();
    ctx.font = "600 12px 'Outfit', sans-serif";
    ctx.fillStyle = THEME.text; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    chart.data.labels.forEach((_, i) => {
      const total = metas.reduce((a, m) => a + (chart.data.datasets[m.index].data[i] || 0), 0);
      if (!total) return;
      const top = Math.min(...metas.map(m => m.data[i] ? m.data[i].y : Infinity));
      ctx.fillText(total.toLocaleString(), metas[0].data[i].x, top - 6);
    });
    ctx.restore();
  }
};

/* ── Base options for every chart ── */
function baseOpts(extra = {}, pluginsExtra = {}) {
  return {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode:'index', intersect:false },
    animation: { duration: 500, easing: 'easeOutQuart' },
    layout: { padding: { top: 8, right: 6, bottom: 2, left: 4 } },
    plugins: {
      legend: { position: 'top', labels: { usePointStyle: true, pointStyleWidth: 10, boxHeight: 7, padding: 16,
                font: { family:"'Outfit', sans-serif", size: 11, weight: '600' } } },
      tooltip: TOOLTIP,
      datalabels: { display: false },
      ...pluginsExtra
    },
    ...extra
  };
}
if (window.ChartDataLabels) Chart.register(ChartDataLabels);

/* Data-label presets — all obey showLabels */
const DL = {
  line:     { display: () => showLabels, anchor:'top', align:'top', offset:3,
              formatter: v => v != null ? v.toLocaleString() : '',
              font:{ size:10, family:"'Outfit', sans-serif", weight:'700' }, color:'#1C1C1E', padding:2 },
  linePct:  { display: ctx => showLabels && !ctx.dataset.isTarget, anchor:'top', align:'top', offset:3,
              formatter: v => v != null ? v.toFixed(1) + '%' : '',
              font:{ size:10, family:"'Outfit', sans-serif", weight:'700' }, color: ctx => ctx.dataset.borderColor, padding:2 },
  barGroup: { display: () => showLabels, anchor:'end', align:'top', offset:2,
              formatter: v => v > 0 ? v.toLocaleString() : '',
              font:{ size:10, family:"'Outfit', sans-serif", weight:'700' }, color:'#1C1C1E', padding:2 },
  /* inside stacked segments, only when the segment is ≥ 9% of its bar (value-based, works during animation) */
  barStack: { display: ctx => {
                if (!showLabels) return false;
                const i = ctx.dataIndex, sets = ctx.chart.data.datasets;
                const tot = sets.reduce((a, d, k) => a + (ctx.chart.isDatasetVisible(k) ? (d.data[i] || 0) : 0), 0);
                return tot > 0 && (ctx.dataset.data[i] || 0) / tot >= 0.09;
              },
              anchor:'center', align:'center', formatter: v => v > 0 ? v.toLocaleString() : '',
              font:{ size:11, family:"'Outfit', sans-serif", weight:'600' }, color: ctx => ctx.dataset.dlColor || '#fff' }
};

/* Target line dataset (dashed, no points, no labels, hidden from legends via isTarget) */
function targetLine(labels, value = TARGET, label = TARGET_LABEL) {
  return { type:'line', label, isTarget: true, data: labels.map(() => value), borderColor: THEME.target,
           borderDash:[6,4], borderWidth:1.5, pointRadius:0, pointHoverRadius:0, fill:false, tension:0, datalabels:{ display:false } };
}

function gvizFetch(url) {
  return new Promise((resolve, reject) => {
    const cbName = '__gviz_cb_' + (++_cb);
    const script = document.createElement('script');
    const timer  = setTimeout(() => { cleanup(); reject(new Error('timed out')); }, 15000);
    function cleanup() { clearTimeout(timer); delete window[cbName]; if (script.parentNode) script.remove(); }
    window[cbName] = function (res) {
      cleanup();
      try {
        const cols = res.table.cols.map(c => (c.label || c.id || '').trim());
        resolve((res.table.rows || []).map(r => {
          const obj = {};
          (r.c || []).forEach((cell, i) => { obj[cols[i]] = (cell && cell.v !== null && cell.v !== undefined) ? cell.v : ''; });
          return obj;
        }));
      } catch (e) { reject(new Error('sheet parse failed: ' + e.message)); }
    };
    script.onerror = () => { cleanup(); reject(new Error('sheet could not be loaded')); };
    script.src = url + '&tqx=responseHandler:' + cbName;
    document.head.appendChild(script);
  });
}

function num(v) { if (v === null || v === undefined || v === '') return 0; const n = parseFloat(String(v).replace(/[,%\s]/g, '')); return isNaN(n) ? 0 : n; }
function orNull(v) { if (v === null || v === undefined || v === '') return null; const n = parseFloat(String(v).replace(/[,%\s]/g, '')); return isNaN(n) ? null : n; }
function str(v) { return v === null || v === undefined ? '' : String(v).trim(); }
function parseDate(v) {
  if (!v) return '';
  if (v instanceof Date) return ymd(v);
  const s = String(v);
  const m = s.match(/^Date\((\d+),(\d+),(\d+)/);
  if (m) return `${m[1]}-${pad(+m[2] + 1)}-${pad(+m[3])}`;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  return s;
}
/* time_bucket arrives as a Date, [h,m,s,ms], a day fraction, "Date(1899,11,30,7,30,0)" or "7:30 AM" → "07:30" */
function normalizeBucket(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v instanceof Date) return `${pad(v.getHours())}:${pad(v.getMinutes())}`;
  if (Array.isArray(v)) return `${pad(v[0])}:${pad(v[1])}`;
  if (typeof v === 'number') { const t = Math.round(v * 1440); return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`; }
  const s = String(v).trim();
  const dm = s.match(/^Date\(\d+,\d+,\d+,(\d+),(\d+)/);
  if (dm) return `${pad(dm[1])}:${pad(dm[2])}`;
  const m = s.match(/^(\d+):(\d+)(?::\d+)?\s*(AM|PM)?$/i);
  if (!m) return s;
  let h = parseInt(m[1], 10);
  const ap = m[3] ? m[3].toUpperCase() : null;
  if (ap === 'PM' && h < 12) h += 12;
  if (ap === 'AM' && h === 12) h = 0;
  return `${pad(h)}:${m[2]}`;
}
const dedupe = (rows, key) => [...new Map(rows.map(r => [key(r), r])).values()];

function normalise(d, s, i, tok, wd) {
  let daily = d.map(r => ({
    date: parseDate(r.date),
    total_rx: num(r.total_rx), within_30min_pct: num(r.within_30min_pct),
    avg_wait_min: num(r.avg_wait_min), median_wait_min: num(r.median_wait_min),
    n_PF: num(r.n_PF), n_PRP: num(r.n_PRP), n_PPF: num(r.n_PPF), n_item: num(r.n_item),
  })).filter(r => r.date).sort((a, b) => a.date.localeCompare(b.date));
  // One row per date; drop zero-Rx days (closed days, failed extracts)
  daily = dedupe(daily, r => r.date).filter(r => r.total_rx > 0);
  const valid = new Set(daily.map(r => r.date));

  const service = dedupe(s.map(r => ({
    date: parseDate(r.date), service: str(r.service),
    total_rx: num(r.total_rx), within_30min_pct: num(r.within_30min_pct),
    avg_wait_min: num(r.avg_wait_min), median_wait_min: num(r.median_wait_min),
  })).filter(r => r.date && r.service), r => r.date + '|' + r.service).filter(r => valid.has(r.date));

  const intraday = dedupe(i.map(r => ({
    date: parseDate(r.date), time_bucket: normalizeBucket(r.time_bucket),
    avg_wait_served_min: orNull(r.avg_wait_served_min),
    live_patients_peak: orNull(r.live_patients_peak),
    cum_within_30min_pct: orNull(r.cum_within_30min_pct),
  })).filter(r => r.date && r.time_bucket), r => r.date + '|' + r.time_bucket).filter(r => valid.has(r.date));

  const token = dedupe(tok.map(r => ({
    date: parseDate(r.date), token: str(r.token), tickets: num(r.tickets),
    wait_min: num(r.wait_min), wait_avg: num(r.wait_avg), wait_max: num(r.wait_max),
    serve_avg: num(r.serve_avg), pct_wait: num(r.pct_wait), pct_serve: num(r.pct_serve),
  })).filter(r => r.date && r.token), r => r.date + '|' + r.token).filter(r => valid.has(r.date));

  const wdRows = dedupe(wd.map(r => {
    const o = { date: parseDate(r.date), total: num(r.total) };
    WD_BUCKETS.forEach(([k]) => { o[k] = num(r[k]); o[k + 'p'] = num(r[k + 'p']); });
    return o;
  }).filter(r => r.date), r => r.date).filter(r => r.total > 0 && valid.has(r.date));

  return { daily, service, intraday, token, wd: wdRows };
}

async function loadData() {
  const btn = $('#refresh-btn');
  btn.classList.add('busy'); btn.disabled = true;
  try {
    const [d, s, i, tok, wd] = await Promise.all([
      gvizFetch(SHEET_URL('daily_summary')),
      gvizFetch(SHEET_URL('service_summary')),
      gvizFetch(SHEET_URL('intraday')),
      gvizFetch(SHEET_URL('token_summary')).catch(() => []),
      gvizFetch(SHEET_URL('wait_dist')).catch(() => []),
    ]);
    data = Object.assign(normalise(d, s, i, tok, wd), { fetchedAt: Date.now(), cached: false });
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {}
    hideBanner();
  } catch (err) {
    if (!data) {
      try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.daily) data = Object.assign(c, { cached: true }); } catch (e) {}
    }
    showBanner(data
      ? `Couldn't reach the Google Sheet (${err.message}). Showing the copy fetched ${fmtStamp(data.fetchedAt)} instead.`
      : `Couldn't reach the Google Sheet (${err.message}), and there's no saved copy on this device. Check the sheet is shared as "anyone with the link can view", then refresh.`);
  } finally {
    btn.classList.remove('busy'); btn.disabled = false;
  }
  updateStamp();
  if (!data) { renderNoData(); return; }
  initControls();
  markAllStale();
  renderCurrent();
}

function showBanner(msg) { const b = $('#error-banner'); b.textContent = msg; b.classList.add('visible'); }
function hideBanner() { $('#error-banner').classList.remove('visible'); }
function updateStamp() {
  const txt = data ? `${data.cached ? 'Saved copy · data fetched' : 'Data fetched'} ${fmtStamp(data.fetchedAt)}` : 'No data';
  $('#last-updated').textContent = txt;
  $('#hstamp').textContent = txt;
  $('#sd-fetched').textContent = data ? fmtStamp(data.fetchedAt) : '—';
  $('#sd-days').textContent = data ? data.daily.length.toLocaleString() : '—';
  $('#sd-latest').textContent = data && data.daily.length ? fmtDayY(latestDate()) : '—';
}

/* ── Derived data ── */
const latestDate = () => data.daily[data.daily.length - 1].date;
const dailyBetween = (a, b) => data.daily.filter(r => r.date >= a && r.date <= b);
const rangeRows = () => dailyBetween(state.from, state.to);
const svcBetween = (a, b) => data.service.filter(r => r.date >= a && r.date <= b && state.services.has(r.service));

/* Rx-weighted stats for a set of daily rows: pct = patients within 30 min ÷ all patients */
function stats(rows) {
  if (!rows.length) return null;
  const rx = sum(rows, r => r.total_rx);
  const within = sum(rows, r => r.within_30min_pct * r.total_rx / 100);
  const staffRows = rows.filter(r => staffOf(r) > 0);
  const itemRows = rows.filter(r => r.n_item > 0);
  return {
    days: rows.length, rx, within,
    pct: rx ? within / rx * 100 : null,
    avgWait: rx ? sum(rows, r => r.avg_wait_min * r.total_rx) / rx : null,
    medWait: mean(rows.map(r => r.median_wait_min)),
    hit: rows.filter(r => r.within_30min_pct >= TARGET).length,
    staff: staffRows.length ? mean(staffRows.map(staffOf)) : null,
    items: sum(itemRows, r => r.n_item),
    itemsPerDay: itemRows.length ? sum(itemRows, r => r.n_item) / itemRows.length : null,
  };
}

/* Mon–Fri days after `from` up to and including `to` (public holidays not known) */
function weekdaysAfter(from, to) {
  let n = 0;
  for (let d = addDays(from, 1); d <= to; d = addDays(d, 1)) { const w = toD(d).getDay(); if (w > 0 && w < 6) n++; }
  return n;
}

/* Gap to target: need = (TARGET × (sofar + future) − achieved) / future */
function gapText(st, latest, periodEnd, periodName) {
  const short = Math.max(0, Math.round(TARGET / 100 * st.rx - st.within));
  const left = weekdaysAfter(latest, periodEnd);
  if (!left) return st.pct >= TARGET ? `Closed on target` : `Closed <b>${fmtN(short)}</b> patients short`;
  const future = st.rx / st.days * left;
  const need = (TARGET / 100 * (st.rx + future) - st.within) / future * 100;
  if (st.pct >= TARGET) return `Stays on target if the rest of ${periodName} is ≥ <b>${Math.max(0, need).toFixed(1)}%</b>`;
  if (need > 100) return `Can't reach ${TARGET}% in ${periodName} · <b>${fmtN(short)}</b> short so far`;
  return `Needs <b>${need.toFixed(1)}%</b> for the rest of ${periodName} · ${fmtN(short)} short so far`;
}

const SCOPES = {
  range:  ['Date filter',   'Follows the From / To date filter'],
  ytd:    ['YTD',           'Year to date: 1 January to the latest day with data'],
  latest: ['Latest days',   'The most recent days with data, whatever the date filter'],
  month:  ['Month picker',  'Follows the month chosen on this card'],
  day:    ['Selected day',  'Follows the day chosen at the top of this tab'],
  svc:    ['Date + services', 'Follows the date filter and the services selected in the dock'],
  all:    ['All days',      'Every day in the sheet, whatever the date filter'],
  allsvc: ['All months',    'Every month in the sheet; rows follow the services selected in the dock'],
};
function scopeTag(kind) {
  const [txt, tip] = SCOPES[kind];
  return `<span class="scope-tag ${kind === 'ytd' ? 'ytd' : ''}${kind === 'all' || kind === 'allsvc' ? ' all' : ''}" title="${tip}">${txt}</span>`;
}
function card({ title, scope, meta = '', actions = '', body, cls = '' }) {
  return `<div class="card ${cls}"><div class="card-header"><div class="card-title-wrap">
      <span class="card-title-row"><span class="card-title">${title}</span>${scope ? scopeTag(scope) : ''}</span>
      ${meta ? `<span class="card-meta">${meta}</span>` : ''}</div>

}
const chartBox = (id, h = 300) => `<div class="chart-wrap" style="height:${h}px"><canvas id="${id}"></canvas></div>`;
const pngBtn = (key, name) => `<button class="btn-dl" data-png="${key}" data-name="${name}">PNG</button>`;
const csvBtn = (table, name) => `<button class="btn-dl" data-csv="${table}" data-name="${name}">CSV</button>`;
const targetNote = txt => `<div class="target-note">${txt}</div>`;
function emptyCard(reason, line, reset = true) {
  return `<div class="card empty-card"><div class="empty-ico">∅</div><div class="card-title">${reason}</div>
    <div class="card-meta" style="max-width:440px">${line}</div>

}
function statusBadge(pct) {
  if (pct === null || pct === undefined || !isFinite(pct)) return '<span class="card-meta">—</span>';
  const cls = pct >= TARGET ? 'badge-green' : pct >= NEAR ? 'badge-amber' : 'badge-red';
  return `<span class="badge ${cls}">${pct.toFixed(1)}%</span>`;
}
function heroStat(label, pct, gap, key) {
  const st = kpiStatus(pct);
  const ico = STATUS_ICON[st.cls];
  // Start from the previous status so the icon can morph into the new one
  const from = ico && morphReady() && lastStatus[key] ? lastStatus[key] : ico;
  const icon = ico ? `<morph-icon data-k="${key}" data-st="${ico}" data-from="${from}" size="13" stroke-width="2.2" spring="snappy">${miSvg(from)}</morph-icon>` : '';
  return `<div class="hero-stat ${st.cls}"><div class="v">${fmt1(pct)}<small>%</small></div>
    <span class="st-chip">${icon}${st.label}</span><div class="l">${label}</div><div class="gap">${gap}</div></div>`;
}
function heroNeutral(value, unit, label, hint = '') {
  return `<div class="hero-stat neutral"><div class="v">${value}${unit ? `<small>${unit}</small>` : ''}</div>
    <div class="l">${label}</div>${hint ? `<div class="gap">${hint}</div>` : ''}</div>`;
}
function progPill(label, right, pct, fill, fg, outline = false) {
  const w = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  return `<div><div class="prog-lbl"><span>${label}</span><span>${right}</span></div>
    <div class="prog-bar" title="${TARGET}% target marked">${pct === null
      ? `<div style="width:0;min-width:0"></div>`
      : `<div class="${outline ? 'outline' : ''}" style="width:${w}%;${outline ? '' : `background:${fill};color:${fg}`}">${pct.toFixed(1)}%</div>`}
      <i style="left:${TARGET}%"></i></div></div>`;
}
const svcIcon = (key, cls = 'svc-ico') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-${key}"/></svg>`;

/* Chart registry per tab; charts on hidden tabs are never built */
function mk(tab, key, cfg) {
  const el = document.getElementById(key);
  if (!el) return null;
  if (printing) cfg.options = Object.assign({}, cfg.options, { animation: false });
  return (charts[tab][key] = new Chart(el, cfg));
}
function destroyTab(tab) { Object.values(charts[tab]).forEach(c => c.destroy()); charts[tab] = {}; }
const manyPoints = n => n > 45;
const fewForLabels = n => n <= 31;

const xDays = () => ({ grid: { display: false }, border: { display: false }, ticks: { ...TICKS, maxRotation: 0, autoSkip: true, maxTicksLimit: 12 } });
const yPct = min => ({ min, max: 100, grid: GRID, border: { display: false }, ticks: { ...TICKS, maxTicksLimit: 6, callback: v => v + '%' } });
const pctFloor = vals => { const v = vals.filter(x => x !== null && isFinite(x)); return Math.max(0, Math.floor((Math.min(TARGET, ...v) - 6) / 10) * 10); };
const legendTopRight = (extra = {}) => ({ position: 'top', align: 'end', labels: { usePointStyle: true, boxHeight: 7, padding: 14, filter: (i, d) => !d.datasets[i.datasetIndex].isTarget, ...extra } });

function lineSeries(label, values, color, canvas, opts = {}) {

  }, opts);
}

/* ══════════════════════════ Tab 0 — Waiting time ══════════════════════════ */
function renderOverview() {
  const el = $('#panel-0');
  const D = data.daily;
  if (!D.length) { el.innerHTML = emptyCard('No queue data yet', 'Run <b>pharmacy_queue.exe</b> on the office PC to push today\'s queue data, then refresh this page.', false); return; }

  const latest = latestDate(), ym = latest.slice(0, 7), yr = latest.slice(0, 4);
  const day = D[D.length - 1];
  const sDay = stats([day]);
  const sMtd = stats(dailyBetween(ym + '-01', latest));
  const sYtd = stats(dailyBetween(yr + '-01-01', latest));
  const monthEnd = ymd(new Date(+yr, +ym.slice(5), 0));
  const over = Math.round(sDay.rx - sDay.within);

  const hero = `<div class="hero"><h1>Seen within 30 min,<br>latest day <span>${DOW_LONG[toD(latest).getDay()]} ${fmtDayY(latest)}</span></h1>
    <div class="hero-stats">
      ${heroStat(`Latest day · ${fmtDay(latest)}`, sDay.pct, `<b>${fmtN(over)}</b> of ${fmtN(sDay.rx)} patients waited over ${TARGET_WAIT_MIN} min`, 'day')}
      ${heroStat(`Month to date · ${MON[+ym.slice(5) - 1]}`, sMtd.pct, gapText(sMtd, latest, monthEnd, MON[+ym.slice(5) - 1]), 'mtd')}
      ${heroStat(`Year to date · ${yr}`, sYtd.pct, gapText(sYtd, latest, `${yr}-12-31`, yr), 'ytd')}
    </div></div>`;

  // Progress pills: each service on the latest day, then the selected range (outline = cumulative)
  const svcDay = Object.fromEntries(data.service.filter(r => r.date === latest).map(r => [r.service, r]));
  const rows = rangeRows();
  const sR = stats(rows);
  const prog = `<div class="prog-row">
    ${SVC.map(s => progPill(s.label, fmtDay(latest), svcDay[s.key] ? svcDay[s.key].within_30min_pct : null, `var(${s.css})`, 'var(--svc-on)')).join('')}
    ${progPill('All services · date filter', sR ? `${sR.days} days` : '—', sR ? sR.pct : null, '', '', true)}
  </div>`;

  if (!sR) {
    el.innerHTML = hero + prog + emptyCard('No days in this date range', `There's no queue data between ${fmtDayY(state.from)} and ${fmtDayY(state.to)}. Pick a wider range or reset the filters.`);
    return;
  }

  // Gauge: selected range vs the same number of days just before it
  const len = daysIn(state.from, state.to);
  const sPrev = stats(dailyBetween(addDays(state.from, -len), addDays(state.from, -1)));
  const G_C = 2 * Math.PI * 46;
  const ticks = Array.from({ length: 40 }, (_, i) => `<line x1="60" y1="4" x2="60" y2="7" stroke="var(--line)" stroke-width="1.4" transform="rotate(${i * 9} 60 60)"/>`).join('');
  const chip = sPrev ? `<span class="neutral-chip">${sR.pct >= sPrev.pct ? '↗' : '↘'} ${fmtPts(sR.pct - sPrev.pct)} vs previous ${len} days</span>`
                     : `<span class="neutral-chip">No earlier data to compare</span>`;
  const gauge = `<div class="gauge-wrap"><svg viewBox="0 0 120 120" role="img" aria-label="${fmt1(sR.pct)}% within 30 minutes">
      ${ticks}
      <circle cx="60" cy="60" r="46" fill="none" stroke="var(--line)" stroke-width="10"/>
      <circle cx="60" cy="60" r="46" fill="none" stroke="var(--pj)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${(G_C * sR.pct / 100).toFixed(1)} ${G_C.toFixed(1)}" transform="rotate(-90 60 60)"/>
      <line x1="60" y1="9" x2="60" y2="19" stroke="var(--text)" stroke-width="2" opacity=".5" transform="rotate(${TARGET * 3.6} 60 60)"/>
      <text x="60" y="61" text-anchor="middle" style="font:800 19px 'Archivo', var(--font);font-stretch:112%;fill:var(--text)">${fmt1(sR.pct)}%</text>
      <text x="60" y="76" text-anchor="middle" style="font:400 9px var(--font);fill:var(--muted)">target ${TARGET}%</text>
    </svg>${chip}<div class="gauge-sub"><b>${sR.hit}</b> of ${sR.days} days on target · ${fmtN(sR.rx)} patients</div></div>`;

  // Dark feature card: month to date vs the same days last month
  const [y, m, d] = latest.split('-').map(Number);
  const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y;
  const pEnd = ymd(new Date(py, pm - 1, Math.min(d, new Date(py, pm, 0).getDate())));
  const sPm = stats(dailyBetween(`${py}-${pad(pm)}-01`, pEnd));
  const ICONS = {
    pct:   '<path d="M5 12l4 4 10-10"/>',
    rx:    '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 4.5a3 3 0 0 1 0 6M18 14c2 .8 3 2.8 3 6"/>',
    item:  '<rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V4h6v3"/>',
    wait:  '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    med:   '<path d="M4 18h16M7 18V10M12 18V6M17 18v-5"/>',
    staff: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>',
  };
  function moRow(icon, name, val, sub, cur, prev, kind) {
    let mv = '<span class="mv na">—</span>';
    if (cur !== null && prev !== null && prev !== undefined && isFinite(cur) && isFinite(prev) && prev !== 0) {
      const diff = cur - prev, arrow = diff > 0 ? '▲' : diff < 0 ? '▼' : '→';

      const good = kind === 'pts' ? diff >= 0 : kind === 'min' ? diff <= 0 : null;
      mv = `<span class="mv ${good === null || Math.abs(diff) < 0.05 ? 'na' : good ? 'up' : 'dn'}">${arrow} ${txt}</span>`;
    }
    return `<div class="rank-row"><span class="rank-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[icon]}</svg></span>
      <span class="nm">${name}<small>${sub}</small></span><span class="val">${val}</span>${mv}</div>`;
  }
  const P = sPm || {};
  const moCard = `<div class="card rank-card"><div class="card-header"><div class="card-title-wrap">
      <span class="card-title">Month to date</span><span class="card-meta">${fmtRange(ym + '-01', latest)}${sPm ? ` vs ${fmtRange(`${py}-${pad(pm)}-01`, pEnd)}` : ''}</span></div>
      <div class="rank-head-r"><span class="rank-big">${sMtd.hit}/${sMtd.days}</span><span class="rank-cap">days on target</span></div></div>
    <div class="rank-list">
      ${moRow('pct', 'Within 30 min', fmt1(sMtd.pct) + '%', 'patients, all services', sMtd.pct, P.pct, 'pts')}

function renderBreakdown() {
  const wrap = $('#bd-wrap');

  const wd = Object.fromEntries(data.wd.map(w => [w.date, w]));
  const cell = v => (v === undefined || v === null) ? '—' : fmtN(v);
  const staffTxt = r => staffOf(r) ? `${r.n_PF}, ${r.n_PRP}, ${r.n_PPF}` : '—';
  const body = rows.map(r => { const w = wd[r.date] || {}; return `<tr class="clickable" data-date="${r.date}" tabindex="0" title="Open ${fmtDayY(r.date)} in Daily operations">
      <td><span class="dow">${dowOf(r.date)}</span>${fmtDayY(r.date)}</td>
      <td class="num">${fmtN(r.total_rx)}</td><td class="num">${r.n_item ? fmtN(r.n_item) : '—'}</td>

    <tbody>${body}${total}</tbody></table>`;

}

function tokenTable(date) {
  if (!data.token.length) return `<div class="chart-empty" style="padding:24px">No token summary in the sheet yet (needs the token_summary tab).</div>`;
  const rows = data.token.filter(r => r.date === date);
  if (!rows.length) return `<div class="chart-empty" style="padding:24px">No token summary for ${fmtDayY(date)}.</div>`;
  const body = rows.map(r => `<tr><td>${esc(r.token)}</td><td class="num">${fmtN(r.tickets)}</td><td class="num">${fmt1(r.wait_min)}</td>
    <td class="num">${fmt1(r.wait_avg)}</td><td class="num">${fmt1(r.wait_max)}</td><td class="num">${fmt1(r.serve_avg)}</td>
    <td class="num">${statusBadge(r.pct_wait)}</td><td class="num">${statusBadge(r.pct_serve)}</td></tr>`).join('');
  const t = sum(rows, r => r.tickets);
  const w = k => t ? sum(rows, r => r[k] * r.tickets) / t : null;
  const total = t ? `<tr><td>All tokens</td><td class="num">${fmtN(t)}</td><td class="num">${fmt1(Math.min(...rows.map(r => r.wait_min)))}</td>
    <td class="num">${fmt1(w('wait_avg'))}</td><td class="num">${fmt1(Math.max(...rows.map(r => r.wait_max)))}</td><td class="num">${fmt1(w('serve_avg'))}</td>
    <td class="num">${statusBadge(w('pct_wait'))}</td><td class="num">${statusBadge(w('pct_serve'))}</td></tr>` : '';
  return `<div class="table-wrap"><table id="t-token"><thead><tr><th>Token</th><th class="num">Tickets</th>
    <th class="num">Wait min</th><th class="num">Wait avg</th><th class="num">Wait max</th><th class="num">Serve avg</th>
    <th class="num">Meets target<span class="th-sub">wait</span></th><th class="num">Meets target<span class="th-sub">serve</span></th></tr></thead>
    <tbody>${body}${total}</tbody></table></div>`;
}

function nearestDay(v) {
  const dates = data.daily.map(r => r.date);
  return dates.find(d => d >= v) || dates[dates.length - 1];
}
function setDay(d) { state.day = d; stale[1] = true; renderCurrent(); }
function openDay(d) { state.day = d; stale[1] = true; switchTab(1); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ══════════════════════════ Tab 2 — Service insight ══════════════════════════ */
function svcStats(rows) {
  if (!rows.length) return null;
  const rx = sum(rows, r => r.total_rx);
  return {
    rx, days: rows.length,
    pct: rx ? sum(rows, r => r.within_30min_pct * r.total_rx) / rx : null,
    avgWait: rx ? sum(rows, r => r.avg_wait_min * r.total_rx) / rx : null,
    medWait: mean(rows.map(r => r.median_wait_min)),
  };
}
function spark(values) {
  const v = values.filter(x => x !== null && isFinite(x));
  if (v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = values.map((x, i) => x === null ? null : [i / (values.length - 1) * 100, 26 - (x - lo) / span * 24]).filter(Boolean);
  const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  return `<svg class="svc-spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true">
    <polygon class="spark-area" points="${pts[0][0].toFixed(1)},28 ${line} ${pts[pts.length - 1][0].toFixed(1)},28"/>
    <polyline points="${line}" vector-effect="non-scaling-stroke"/></svg>`;
}
